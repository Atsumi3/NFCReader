name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          file=gradle.properties
          major=$(grep '^VERSION_MAJOR=' "$file" | cut -d= -f2)
          minor=$(grep '^VERSION_MINOR=' "$file" | cut -d= -f2)
          patch=$(grep '^VERSION_PATCH=' "$file" | cut -d= -f2)
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          sed -i "s/^VERSION_MAJOR=.*/VERSION_MAJOR=$major/" "$file"
          sed -i "s/^VERSION_MINOR=.*/VERSION_MINOR=$minor/" "$file"
          sed -i "s/^VERSION_PATCH=.*/VERSION_PATCH=$patch/" "$file"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Stage APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="nfcreader-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Bump version to $VERSION"
          git push origin develop

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          gh release create "$VERSION" "$APK" \
            --title "$VERSION" \
            --target develop \
            --generate-notes
