name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          problem-matcher: true

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true

      - name: Install Android SDK 37.1 and build tools
        run: sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Check
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease
