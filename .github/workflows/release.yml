name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      artifact_only:
        description: "Build and upload a signed Release APK without publishing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Record develop revision
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building develop HEAD $sha"

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          problem-matcher: true

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true

      - name: Install Android SDK 37.1 and build tools
        run: sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Read or bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          ARTIFACT_ONLY: ${{ inputs.artifact_only }}
        run: |
          file=gradle.properties
          major=$(grep '^VERSION_MAJOR=' "$file" | cut -d= -f2)
          minor=$(grep '^VERSION_MINOR=' "$file" | cut -d= -f2)
          patch=$(grep '^VERSION_PATCH=' "$file" | cut -d= -f2)
          if [ "$ARTIFACT_ONLY" != "true" ]; then
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            sed -i "s/^VERSION_MAJOR=.*/VERSION_MAJOR=$major/" "$file"
            sed -i "s/^VERSION_MINOR=.*/VERSION_MINOR=$minor/" "$file"
            sed -i "s/^VERSION_PATCH=.*/VERSION_PATCH=$patch/" "$file"
          fi
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify signed Release APK
        if: ${{ inputs.artifact_only }}
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root is not set}}"
          "$sdk_root/build-tools/37.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Stage APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="nfcreader-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload signed Release APK artifact
        if: ${{ inputs.artifact_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-apk-${{ steps.source.outputs.sha }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 7

      - name: Commit version bump
        if: ${{ !inputs.artifact_only }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Bump version to $VERSION"
          git push origin develop

      - name: Create release
        if: ${{ !inputs.artifact_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          gh release create "$VERSION" "$APK" \
            --title "$VERSION" \
            --target develop \
            --generate-notes
